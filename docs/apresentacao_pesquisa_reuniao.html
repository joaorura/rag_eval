<li>A similaridade de cosseno condensa centenas de tokens em um único escalar, perdendo correlações sutis e ordenamento estrito de passos técnicos (ex.: ordem de manobra de disjuntores, intertravamentos lógicos e diferenças sutis entre famílias de no-breaks).</li>

</li>
<li>
<p><strong>O Teto de Precisão no Top-5</strong>:</p>
<ul>
<li>No 1º estágio, mesmo o melhor modelo (<code>e5-large</code>) atinge MRR@5 de 0.4031 — ou seja, na maioria das consultas, o nó mais relevante não está no primeiro posto (<mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="6.16ex" height="1.731ex" role="img" focusable="false" viewBox="0 -683 2722.6 765"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g><g data-mml-node="mo" transform="translate(1166.8,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(2222.6,0)"><path data-c="31" d="M213 578L200 573Q186 568 160 563T102 556H83V602H102Q149 604 189 617T245 641T273 663Q275 666 285 666Q294 666 302 660V361L303 61Q310 54 </li>
<li>

<h2 id="10-impacto-do-projeto-de-ict-e-pr%C3%B3ximos-passos">10. Impacto do Projeto de ICT e Próximos Passos</h2>

<li>
<p><strong>Principais Conquistas e Validações Científicas</strong>:</p>
<ul>
<li><strong>Quebra de Paradigma</strong>: Modelos abertos locais quantizados superam soluções comerciais proprietárias em tarefas técnicas de recuperação de informação eletrotécnica.</li>
<li><strong>Soberania &amp; Custo Zero</strong>: Viabilidade técnica comprovada de RAG Two-Stage de alta fidelidade em hardware pessoal/workstation de 8 GB GDDR6.</li>
<li><strong>Blindagem de Ativos</strong>: Proteção absoluta de segredos industriais e propriedade intelectual da CM Comandos.</li>
</ul>
</li>
<li>
<p><strong>Próximos Passos Tecnológicos</strong>:</p>
<ul>

<li><strong>Piloto Operacional</strong>: Implantação de ambiente piloto integrado à base de chamados técnicos e suporte ao cliente da CM Comandos Lineares.</li>
</ul>
</li>
</ul>
